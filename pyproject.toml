[project]
name = "gdg-gde-community-hub-agent"
version = "0.1.0"
description = "GDG/GDE 이벤트 운영진을 위한 DevFest, Build with AI 커뮤니티 허브 및 국내 운영진 데이터 기반 ADK RAG + A2A 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-storage>=2.18.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
a2a = [
    "a2a-sdk>=0.2.0",
]
gcp-pgvector = [
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
]
browser = [
    "playwright>=1.48.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["community_hub_agent", "remote_client_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
